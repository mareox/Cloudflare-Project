<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="cfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="acmeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="srvGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="ispGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.04"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-opacity="0.20"/>
    </filter>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="510" rx="8" fill="#0f172a"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">Magic Transit — DSR Packet Flow (TCP/443)</text>

  <!-- ── FORWARD PATH ── -->
  <rect x="14" y="46" width="932" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="480" y="62" text-anchor="middle" fill="#f97316" font-size="10" font-weight="700" letter-spacing="0.5">FORWARD PATH — User → Server via Cloudflare</text>

  <!-- User (fwd) -->
  <rect x="16" y="78" width="142" height="128" rx="7" fill="url(#userGrad)" stroke="#8b5cf6" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="87" y="98" text-anchor="middle" fill="#c4b5fd" font-size="9.5" font-weight="700" letter-spacing="0.4">USER</text>
  <text x="87" y="114" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">End Client</text>
  <text x="87" y="129" text-anchor="middle" fill="#64748b" font-size="8.5">any ISP</text>
  <text x="28" y="148" fill="#64748b" font-size="8.5">src: USER_PUB_IP</text>
  <text x="28" y="163" fill="#64748b" font-size="8.5">dst: 203.0.113.10</text>
  <text x="28" y="178" fill="#64748b" font-size="8.5">TCP dport: 443</text>

  <!-- Cloudflare PoP -->
  <rect x="194" y="78" width="238" height="152" rx="7" fill="url(#cfGrad)" stroke="#f97316" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="313" y="98" text-anchor="middle" fill="#fb923c" font-size="9.5" font-weight="700" letter-spacing="0.4">CLOUDFLARE ANYCAST PoP</text>
  <text x="313" y="114" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Closest by BGP/anycast</text>
  <text x="313" y="130" text-anchor="middle" fill="#64748b" font-size="8.5">Origin AS12345 per 203.0.113.0/24</text>
  <rect x="209" y="142" width="208" height="15" rx="7" fill="#f97316" fill-opacity="0.10" stroke="#f97316" stroke-width="0.5"/>
  <text x="313" y="153" text-anchor="middle" fill="#fb923c" font-size="8">② DDoS scrub + Magic Firewall (stateless)</text>
  <rect x="209" y="161" width="208" height="15" rx="7" fill="#f97316" fill-opacity="0.10" stroke="#f97316" stroke-width="0.5"/>
  <text x="313" y="172" text-anchor="middle" fill="#fb923c" font-size="8">② MSS clamp SYN 1460 → 1436 in TCP opts</text>
  <rect x="209" y="180" width="208" height="15" rx="7" fill="#f97316" fill-opacity="0.10" stroke="#f97316" stroke-width="0.5"/>
  <text x="313" y="191" text-anchor="middle" fill="#fb923c" font-size="8">③ GRE encapsulate → GRE1 or GRE2 (ECMP)</text>
  <text x="313" y="218" text-anchor="middle" fill="#475569" font-size="8">outer: 192.0.2.10 → 100.100.100.100 · proto 47</text>

  <!-- Acme Edge Router -->
  <rect x="476" y="78" width="210" height="152" rx="7" fill="url(#acmeGrad)" stroke="#3b82f6" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="581" y="98" text-anchor="middle" fill="#93c5fd" font-size="9.5" font-weight="700" letter-spacing="0.4">ACME EDGE ROUTER</text>
  <text x="581" y="114" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">100.100.100.100</text>
  <text x="581" y="130" text-anchor="middle" fill="#64748b" font-size="8.5">GRE terminator</text>
  <rect x="491" y="142" width="180" height="15" rx="7" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="581" y="153" text-anchor="middle" fill="#93c5fd" font-size="8">④ GRE decapsulate outer header</text>
  <rect x="491" y="161" width="180" height="15" rx="7" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="581" y="172" text-anchor="middle" fill="#93c5fd" font-size="8">MSS clamp SYN-ACK → 1436 (CRITICAL)</text>
  <rect x="491" y="180" width="180" height="15" rx="7" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="581" y="191" text-anchor="middle" fill="#93c5fd" font-size="8">Forward inner packet to server LAN</text>

  <!-- Web Server (fwd) -->
  <rect x="730" y="88" width="214" height="118" rx="7" fill="url(#srvGrad)" stroke="#22c55e" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="837" y="108" text-anchor="middle" fill="#86efac" font-size="9.5" font-weight="700" letter-spacing="0.4">WEB SERVER</text>
  <text x="837" y="124" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">203.0.113.10</text>
  <text x="744" y="144" fill="#64748b" font-size="8.5">Sees real USER_PUB_IP</text>
  <text x="744" y="159" fill="#64748b" font-size="8.5">(source IP preserved end-to-end)</text>
  <rect x="744" y="168" width="186" height="15" rx="7" fill="#22c55e" fill-opacity="0.10" stroke="#22c55e" stroke-width="0.5"/>
  <text x="837" y="179" text-anchor="middle" fill="#86efac" font-size="8">← this is the BYOIP win</text>

  <!-- Fwd arrow ①: User → CF -->
  <line x1="159" y1="148" x2="190" y2="148" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <circle cx="172" cy="133" r="9" fill="#1c1452" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="172" y="137" text-anchor="middle" fill="#c4b5fd" font-size="8" font-weight="700">①</text>

  <!-- Fwd arrow ③: CF → Acme (GRE, dashed) -->
  <line x1="433" y1="155" x2="472" y2="155" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrBlue)"/>
  <rect x="436" y="141" width="30" height="12" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="451" y="151" text-anchor="middle" fill="#3b82f6" font-size="7.5" font-weight="700">GRE</text>

  <!-- Fwd arrow: Acme → Web Server -->
  <line x1="687" y1="148" x2="726" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrSlate)"/>

  <!-- ── Asymmetric note between sections ── -->
  <text x="480" y="252" text-anchor="middle" fill="#334155" font-size="8.5" font-style="italic">Asymmetric routing: Cloudflare handles ingress only · return traffic takes direct Internet path (DSR = no CF egress cost)</text>

  <!-- ── RETURN PATH ── -->
  <rect x="14" y="262" width="932" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="480" y="278" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="700" letter-spacing="0.5">RETURN PATH — Server → User DIRECT (no Cloudflare)</text>

  <!-- Web Server (return) -->
  <rect x="730" y="296" width="214" height="96" rx="7" fill="url(#srvGrad)" stroke="#22c55e" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="837" y="316" text-anchor="middle" fill="#86efac" font-size="9.5" font-weight="700" letter-spacing="0.4">WEB SERVER</text>
  <text x="837" y="332" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">203.0.113.10</text>
  <text x="744" y="352" fill="#64748b" font-size="8.5">⑤ src: 203.0.113.10</text>
  <text x="744" y="367" fill="#64748b" font-size="8.5">TCP sport: 443 · MSS=1436 in SYN-ACK</text>

  <!-- Acme Upstream ISP -->
  <rect x="442" y="296" width="212" height="96" rx="7" fill="url(#ispGrad)" stroke="#f59e0b" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="548" y="316" text-anchor="middle" fill="#fcd34d" font-size="9.5" font-weight="700" letter-spacing="0.4">ACME UPSTREAM ISP</text>
  <text x="548" y="332" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Default-route egress</text>
  <text x="456" y="352" fill="#64748b" font-size="8.5">⑥ MSS clamp 1436 on egress</text>
  <text x="456" y="367" fill="#64748b" font-size="8.5">CRITICAL for TCP three-way handshake</text>

  <!-- User (return) -->
  <rect x="16" y="296" width="142" height="96" rx="7" fill="url(#userGrad)" stroke="#8b5cf6" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="87" y="316" text-anchor="middle" fill="#c4b5fd" font-size="9.5" font-weight="700" letter-spacing="0.4">USER</text>
  <text x="87" y="332" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">End Client</text>
  <text x="87" y="352" text-anchor="middle" fill="#64748b" font-size="8.5">⑦ Receives response</text>
  <text x="87" y="367" text-anchor="middle" fill="#64748b" font-size="8.5">directly (no GRE · no CF)</text>

  <!-- Return arrow ⑤: WebServer → ISP (leftward) -->
  <line x1="729" y1="344" x2="658" y2="344" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrGreen)"/>
  <circle cx="694" cy="328" r="9" fill="#052e16" stroke="#22c55e" stroke-width="0.8"/>
  <text x="694" y="332" text-anchor="middle" fill="#22c55e" font-size="8" font-weight="700">⑤</text>

  <!-- Return arrow ⑦: ISP → User (leftward) -->
  <line x1="441" y1="344" x2="162" y2="344" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrGreen)"/>
  <circle cx="302" cy="328" r="9" fill="#052e16" stroke="#22c55e" stroke-width="0.8"/>
  <text x="302" y="332" text-anchor="middle" fill="#22c55e" font-size="8" font-weight="700">⑦</text>

  <!-- ── LEGEND ── -->
  <rect x="14" y="420" width="932" height="76" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="32" y="441" fill="#94a3b8" font-size="10" font-weight="600">Legend</text>
  <line x1="96" y1="441" x2="136" y2="441" stroke="#f97316" stroke-width="2"/>
  <text x="142" y="445" fill="#64748b" font-size="9">Forward path (plain IP packet)</text>
  <line x1="308" y1="441" x2="348" y2="441" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="354" y="445" fill="#64748b" font-size="9">GRE tunnel (proto 47 · ECMP over GRE1/GRE2)</text>
  <line x1="580" y1="441" x2="620" y2="441" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="626" y="445" fill="#64748b" font-size="9">DSR return (direct Internet · no Cloudflare · no GRE)</text>
  <text x="480" y="464" text-anchor="middle" fill="#475569" font-size="8.5">Client IP preserved end-to-end · Cloudflare health-checks each tunnel · ECMP hash on inner 5-tuple · failover within seconds</text>
  <text x="480" y="482" text-anchor="middle" fill="#475569" font-size="8.5">Magic Firewall is stateless (DSR): no established/related state · every rule is a unidirectional 5-tuple match on ingress</text>
</svg>
